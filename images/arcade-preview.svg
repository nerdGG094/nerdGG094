<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="JABDEV Arcade: Desafio da Entrega">
  <defs>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#16442c" stroke-width="2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#145b39"/>
      <stop offset="1" stop-color="#04110c"/>
    </radialGradient>
    <g id="box">
      <rect x="-30" y="-30" width="60" height="60" rx="9" fill="#c5d1c3"/>
      <rect x="-23" y="-23" width="46" height="46" rx="5" fill="#7e9685"/>
      <path d="M-22 0H22" stroke="#e6eee5" stroke-width="3"/>
    </g>
  </defs>
  <rect width="960" height="400" rx="18" fill="url(#glow)"/>
  <rect x="16" y="16" width="928" height="368" rx="12" fill="#0a291b" stroke="#28583d"/>
  <rect x="16" y="16" width="928" height="368" rx="12" fill="url(#grid)"/>

  <use href="#box" x="140" y="90"/>
  <use href="#box" x="300" y="210" transform="rotate(8 300 210)"/>
  <use href="#box" x="660" y="70"/>
  <use href="#box" x="800" y="200" transform="rotate(-6 800 200)"/>
  <use href="#box" x="520" y="150"/>

  <g transform="translate(470 318)">
    <rect x="-13" y="-34" width="26" height="61" rx="8" fill="#9bcb45"/>
    <rect x="-8" y="-45" width="16" height="14" rx="4" fill="#9bcb45"/>
    <rect x="-8" y="-49" width="16" height="7" rx="2" fill="#e7f2d8"/>
    <rect x="-17" y="-9" width="34" height="22" rx="5" fill="#f2f6e9"/>
    <text x="0" y="6" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#087a45" text-anchor="middle">JAB</text>
  </g>

  <rect x="16" y="16" width="928" height="368" rx="12" fill="#04140d" opacity=".55"/>
  <text x="480" y="180" font-family="system-ui,Segoe UI,sans-serif" font-size="46" font-weight="900" letter-spacing="4" fill="#9bcb45" text-anchor="middle">JABDEV ARCADE</text>
  <text x="480" y="222" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="600" letter-spacing="6" fill="#eaf5e9" text-anchor="middle">DESAFIO DA ENTREGA</text>
  <rect x="380" y="250" width="200" height="46" rx="10" fill="#087a45" stroke="#6e9c58"/>
  <text x="480" y="280" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">▶ JOGAR</text>
</svg>
