<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Jaboti Run: o mascote da Jaboti correndo, pulando garrafas PET e coletando tampinhas">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b9cf0"/>
      <stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc093"/>
      <stop offset="1" stop-color="#b18d5a"/>
    </linearGradient>
    <radialGradient id="body" cx="32%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ff8a78"/>
      <stop offset=".5" stop-color="#e3262b"/>
      <stop offset="1" stop-color="#9e1118"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff0aa" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff0aa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset=".7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".25"/>
    </radialGradient>
    <linearGradient id="pet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ca064"/>
      <stop offset=".3" stop-color="#bef5d2"/>
      <stop offset=".55" stop-color="#6ec88c"/>
      <stop offset="1" stop-color="#237848"/>
    </linearGradient>
    <g id="bottle">
      <path d="M-5 -80 V-67 Q-16 -62 -16 -55 V-8 Q-12 1 0 -3 Q12 1 16 -8 V-55 Q16 -62 5 -67 V-80 Z" fill="url(#pet)" stroke="#1f5f3b" stroke-width="2"/>
      <rect x="-16" y="-44" width="32" height="21" fill="#d7262b"/>
      <rect x="-16" y="-36" width="32" height="5" fill="#ffd23a"/>
      <circle cy="-33.5" r="5.5" fill="#fff" opacity=".9"/>
      <rect x="-7.5" y="-86" width="15" height="10" rx="2" fill="#c81e24"/>
      <rect x="-10" y="-60" width="3" height="11" fill="#fff" opacity=".75"/>
    </g>
    <g id="coin">
      <circle r="20" fill="#ffdc5a" opacity=".25"/>
      <circle r="12" fill="#d49a00"/>
      <circle r="8.5" fill="#ffd23a"/>
      <circle cx="-2.5" cy="-2.5" r="3" fill="#fff3a6"/>
    </g>
    <g id="flower">
      <path d="M0 0 Q3 -22 0 -44" stroke="#3f8f35" stroke-width="3" fill="none"/>
      <ellipse cx="7" cy="-20" rx="8" ry="3" fill="#4fa63f" transform="rotate(-28 7 -20)"/>
      <circle cy="-44" r="12" fill="#ffd21f"/>
      <circle cy="-44" r="12" fill="none" stroke="#f5a800" stroke-width="4" stroke-dasharray="3 3"/>
      <circle cy="-44" r="6" fill="#6b3d1c"/>
    </g>
    <g id="tree">
      <rect x="-3" y="-22" width="6" height="22" fill="#7a4e2c"/>
      <circle cy="-34" r="16" fill="#3d9445"/>
      <circle cx="-12" cy="-24" r="11" fill="#3d9445"/>
      <circle cx="12" cy="-25" r="12" fill="#3d9445"/>
      <circle cx="-5" cy="-40" r="7" fill="#5cb653"/>
    </g>
    <clipPath id="frame"><rect width="960" height="360" rx="16"/></clipPath>
    <style>
      .scroll{animation:scroll 2.6s linear infinite}
      .scroll2{animation:scroll 2.6s linear infinite;animation-delay:-1.3s}
      .far{animation:far 30s linear infinite}
      .mid{animation:mid 12s linear infinite}
      .near{animation:near 4s linear infinite}
      .jump{animation:jump 2.6s infinite}
      .legA{transform-origin:-7px -56px;animation:leg .3s ease-in-out infinite alternate}
      .legB{transform-origin:7px -56px;animation:leg .3s ease-in-out infinite alternate-reverse}
      .armA{transform-origin:-17px -69px;animation:leg .3s ease-in-out infinite alternate-reverse}
      .armB{transform-origin:6px -59px;animation:leg .3s ease-in-out infinite alternate}
      .spin{transform-origin:0 -76px;animation:spin 2.6s infinite}
      .blink{transform-origin:0 -86px;animation:blink 3.4s infinite}
      .smoke{animation:smoke 3s ease-out infinite}
      .smoke2{animation:smoke 3s ease-out infinite;animation-delay:-1.5s}
      .coin{animation:coin .6s ease-in-out infinite alternate}
      @keyframes scroll{from{transform:translateX(1020px)}to{transform:translateX(-120px)}}
      @keyframes far{from{transform:translateX(0)}to{transform:translateX(-960px)}}
      @keyframes mid{from{transform:translateX(0)}to{transform:translateX(-480px)}}
      @keyframes near{from{transform:translateX(0)}to{transform:translateX(-232px)}}
      @keyframes jump{
        0%,15%{transform:translateY(0);animation-timing-function:ease-out}
        25%{transform:translateY(-120px);animation-timing-function:ease-in}
        35%,66%{transform:translateY(0);animation-timing-function:ease-out}
        76%{transform:translateY(-150px);animation-timing-function:ease-in}
        86%,100%{transform:translateY(0)}
      }
      @keyframes spin{0%,70%{transform:rotate(0)}82%,100%{transform:rotate(360deg)}}
      @keyframes leg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
      @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
      @keyframes smoke{from{transform:translate(0,0) scale(.6);opacity:.6}to{transform:translate(30px,-50px) scale(1.8);opacity:0}}
      @keyframes coin{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="290" fill="url(#sky)"/>
    <circle cx="790" cy="70" r="90" fill="url(#sun)"/>
    <circle cx="790" cy="70" r="30" fill="#fff6c2"/>

    <!-- nuvens e montanhas -->
    <g class="far">
      <g fill="#fff" opacity=".95">
        <path d="M70 80 a15 15 0 0 1 20 -14 a21 21 0 0 1 40 4 a17 17 0 0 1 26 10 a12 12 0 0 1 4 14 h-90 z"/>
        <path d="M400 54 a13 13 0 0 1 18 -12 a18 18 0 0 1 34 4 a14 14 0 0 1 22 8 a10 10 0 0 1 3 12 h-77 z"/>
        <path d="M640 96 a15 15 0 0 1 20 -14 a21 21 0 0 1 40 4 a17 17 0 0 1 26 10 a12 12 0 0 1 4 14 h-90 z"/>
        <path d="M1030 80 a15 15 0 0 1 20 -14 a21 21 0 0 1 40 4 a17 17 0 0 1 26 10 a12 12 0 0 1 4 14 h-90 z"/>
        <path d="M1360 54 a13 13 0 0 1 18 -12 a18 18 0 0 1 34 4 a14 14 0 0 1 22 8 a10 10 0 0 1 3 12 h-77 z"/>
        <path d="M1600 96 a15 15 0 0 1 20 -14 a21 21 0 0 1 40 4 a17 17 0 0 1 26 10 a12 12 0 0 1 4 14 h-90 z"/>
      </g>
      <path d="M0 290 V190 Q80 160 160 185 T320 180 T480 190 T640 175 T800 185 T960 190 T1120 185 T1280 180 T1440 190 T1600 175 T1760 185 T1920 190 V290 Z" fill="#a9cbe2"/>
      <path d="M0 290 V215 Q60 196 120 212 T240 208 T360 214 T480 204 T600 212 T720 206 T840 214 T960 215 T1080 212 T1200 208 T1320 214 T1440 204 T1560 212 T1680 206 T1800 214 T1920 215 V290 Z" fill="#8fbbd4"/>
    </g>

    <!-- fábrica Jaboti -->
    <g transform="translate(520 246)">
      <rect x="150" y="-92" width="30" height="92" fill="#dfe5ea"/><rect x="170" y="-92" width="10" height="92" fill="#aeb8c0"/>
      <ellipse cx="165" cy="-92" rx="15" ry="6" fill="#dfe5ea"/><rect x="150" y="-60" width="30" height="5" fill="#9bcb45"/>
      <rect x="186" y="-74" width="26" height="74" fill="#dfe5ea"/><rect x="203" y="-74" width="9" height="74" fill="#aeb8c0"/>
      <ellipse cx="199" cy="-74" rx="13" ry="6" fill="#dfe5ea"/><rect x="186" y="-48" width="26" height="5" fill="#9bcb45"/>
      <rect x="22" y="-98" width="14" height="44" fill="#d8ccb0"/><rect x="20" y="-98" width="18" height="6" fill="#b8433a"/>
      <circle class="smoke" cx="29" cy="-106" r="9" fill="#ececec"/>
      <circle class="smoke2" cx="29" cy="-106" r="9" fill="#ececec"/>
      <rect x="0" y="-58" width="148" height="58" fill="#efe4cc"/>
      <path d="M-4 -58 L35 -74 V-58 L74 -74 V-58 L113 -74 V-58 L152 -74 V-58 Z" fill="#b8433a"/>
      <g fill="#7fb2cf">
        <rect x="10" y="-46" width="12" height="9"/><rect x="32" y="-46" width="12" height="9"/><rect x="54" y="-46" width="12" height="9"/>
        <rect x="76" y="-46" width="12" height="9"/><rect x="98" y="-46" width="12" height="9"/><rect x="120" y="-46" width="12" height="9"/>
        <rect x="10" y="-28" width="12" height="9"/><rect x="32" y="-28" width="12" height="9"/><rect x="54" y="-28" width="12" height="9"/>
        <rect x="76" y="-28" width="12" height="9"/><rect x="98" y="-28" width="12" height="9"/><rect x="120" y="-28" width="12" height="9"/>
      </g>
      <rect x="48" y="-82" width="4" height="10" fill="#5a4a3a"/><rect x="96" y="-82" width="4" height="10" fill="#5a4a3a"/>
      <rect x="30" y="-104" width="88" height="24" rx="6" fill="#d7262b"/>
      <text x="74" y="-86" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="900" font-style="italic" fill="#ffd23a" text-anchor="middle">Jaboti</text>
    </g>

    <!-- colinas, árvores, cerca e girassóis -->
    <g class="mid">
      <path d="M0 290 V252 Q85 236 170 250 T340 248 T510 252 T680 246 T850 250 T1020 252 T1190 246 T1360 250 T1530 252 V290 Z" fill="#79c364"/>
      <use href="#tree" x="60" y="258"/><use href="#tree" x="300" y="256" transform="scale(1)"/>
      <use href="#tree" x="420" y="258"/><use href="#tree" x="540" y="258"/>
      <use href="#tree" x="780" y="256"/><use href="#tree" x="900" y="258"/>
      <use href="#tree" x="1020" y="258"/>
    </g>
    <g class="near">
      <g fill="#b9844f"><rect x="0" y="254" width="1200" height="5"/><rect x="0" y="270" width="1200" height="5"/></g>
      <g fill="#9a6a3d">
        <rect x="0" y="246" width="7" height="40"/><rect x="58" y="246" width="7" height="40"/><rect x="116" y="246" width="7" height="40"/>
        <rect x="174" y="246" width="7" height="40"/><rect x="232" y="246" width="7" height="40"/><rect x="290" y="246" width="7" height="40"/>
        <rect x="348" y="246" width="7" height="40"/><rect x="406" y="246" width="7" height="40"/><rect x="464" y="246" width="7" height="40"/>
        <rect x="522" y="246" width="7" height="40"/><rect x="580" y="246" width="7" height="40"/><rect x="638" y="246" width="7" height="40"/>
        <rect x="696" y="246" width="7" height="40"/><rect x="754" y="246" width="7" height="40"/><rect x="812" y="246" width="7" height="40"/>
        <rect x="870" y="246" width="7" height="40"/><rect x="928" y="246" width="7" height="40"/><rect x="986" y="246" width="7" height="40"/>
        <rect x="1044" y="246" width="7" height="40"/><rect x="1102" y="246" width="7" height="40"/><rect x="1160" y="246" width="7" height="40"/>
      </g>
      <use href="#flower" x="30" y="288"/><use href="#flower" x="92" y="288"/><use href="#flower" x="150" y="288"/>
      <use href="#flower" x="262" y="288"/><use href="#flower" x="320" y="288"/><use href="#flower" x="378" y="288"/>
      <use href="#flower" x="494" y="288"/><use href="#flower" x="552" y="288"/><use href="#flower" x="610" y="288"/>
      <use href="#flower" x="726" y="288"/><use href="#flower" x="784" y="288"/><use href="#flower" x="842" y="288"/>
      <use href="#flower" x="958" y="288"/><use href="#flower" x="1016" y="288"/><use href="#flower" x="1074" y="288"/>
      <use href="#flower" x="1190" y="288"/>
    </g>

    <!-- chão -->
    <rect y="283" width="960" height="14" fill="#5daa3f"/>
    <rect y="296" width="960" height="64" fill="url(#path)"/>
    <rect y="296" width="960" height="3" fill="#c9a771"/>
    <g class="near" stroke="#6e4b28" stroke-opacity=".28" stroke-width="2">
      <path d="M0 314 H1200 M0 336 H1200"/>
      <path d="M0 297 V314 M68 297 V314 M136 297 V314 M204 297 V314 M272 297 V314 M340 297 V314 M408 297 V314 M476 297 V314 M544 297 V314 M612 297 V314 M680 297 V314 M748 297 V314 M816 297 V314 M884 297 V314 M952 297 V314 M1020 297 V314 M1088 297 V314 M1156 297 V314"/>
      <path d="M34 314 V336 M102 314 V336 M170 314 V336 M238 314 V336 M306 314 V336 M374 314 V336 M442 314 V336 M510 314 V336 M578 314 V336 M646 314 V336 M714 314 V336 M782 314 V336 M850 314 V336 M918 314 V336 M986 314 V336 M1054 314 V336 M1122 314 V336 M1190 314 V336"/>
    </g>

    <!-- obstáculos e tampinhas -->
    <g class="scroll">
      <use href="#bottle" x="0" y="290"/>
      <use href="#coin" x="-40" y="180"/><use href="#coin" x="0" y="160"/><use href="#coin" x="40" y="180"/>
    </g>
    <g class="scroll2">
      <use href="#bottle" x="0" y="290"/><use href="#bottle" x="38" y="290"/>
      <use href="#coin" x="-30" y="150"/><use href="#coin" x="19" y="128"/><use href="#coin" x="68" y="150"/>
    </g>

    <!-- mascote -->
    <ellipse cx="150" cy="293" rx="26" ry="5" fill="#000" opacity=".2"/>
    <g transform="translate(150 290)">
      <g class="jump"><g class="spin">
        <g class="legA">
          <path d="M-7 -56 L-9 -38 L-7 -20" stroke="#bdbdbd" stroke-width="8.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M-7 -56 L-9 -38 L-7 -20" stroke="#e2e2e2" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="-2" cy="-14" rx="13" ry="7.5" fill="#e3a400" stroke="#b98100" stroke-width="1.5"/>
          <rect x="-14" y="-10.5" width="25" height="4" rx="2" fill="#d8d8d8"/>
        </g>
        <g class="armA">
          <path d="M-17 -69 L-27 -59 L-20 -48" stroke="#bdbdbd" stroke-width="7.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M-17 -69 L-27 -59 L-20 -48" stroke="#e2e2e2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="-20" cy="-48" r="7.5" fill="#e6e6e6" stroke="#bdbdbd" stroke-width="1.5"/>
        </g>
        <g class="legB">
          <path d="M7 -56 L9 -38 L7 -20" stroke="#c4c4c4" stroke-width="8.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 -56 L9 -38 L7 -20" stroke="#f7f7f7" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="12" cy="-14" rx="13" ry="7.5" fill="#ffc61a" stroke="#b98100" stroke-width="1.5"/>
          <rect x="0" y="-10.5" width="25" height="4" rx="2" fill="#fff"/>
        </g>
        <path d="M0 -100 Q-3 -118 9 -128" stroke="#2f7a22" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M0 -100 Q-3 -118 9 -128" stroke="#4caf35" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-6" cy="-117" rx="10" ry="4.5" fill="#5cbf3d" transform="rotate(-50 -6 -117)"/>
        <ellipse cx="0" cy="-76" rx="32" ry="30" fill="url(#body)" stroke="#6e0a0f" stroke-opacity=".5" stroke-width="1.5"/>
        <ellipse cx="-14" cy="-92" rx="8" ry="4.5" fill="#fff" opacity=".4" transform="rotate(-37 -14 -92)"/>
        <ellipse cx="-6" cy="-70" rx="5" ry="3" fill="#ff786e" opacity=".45"/>
        <g class="blink">
          <ellipse cx="3" cy="-85" rx="8.5" ry="10.5" fill="#fff" stroke="#3a1a12" stroke-width="1.6"/>
          <ellipse cx="21" cy="-87" rx="8" ry="10" fill="#fff" stroke="#3a1a12" stroke-width="1.6"/>
          <circle cx="6" cy="-85" r="4.4" fill="#1c0f0b"/><circle cx="24" cy="-87" r="4.4" fill="#1c0f0b"/>
          <circle cx="7.6" cy="-86.8" r="1.5" fill="#fff"/><circle cx="25.6" cy="-88.8" r="1.5" fill="#fff"/>
        </g>
        <path d="M-5 -98 Q2 -104 10 -99 M14 -100 Q21 -105 28 -99" stroke="#3a1a12" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M-3 -72 Q12 -46 28 -74 Q13 -68 -3 -72 Z" fill="#5a0f12"/>
        <ellipse cx="13" cy="-60" rx="7" ry="4.5" fill="#ff8a50"/>
        <path d="M1 -70.8 Q13 -67 25 -72.4 L24 -70 Q13 -65 2 -68.5 Z" fill="#fff"/>
        <g class="armB">
          <path d="M6 -59 L18 -52 L30 -58" stroke="#c4c4c4" stroke-width="7.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 -59 L18 -52 L30 -58" stroke="#f7f7f7" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="30" cy="-58" r="7.5" fill="#fff" stroke="#bdbdbd" stroke-width="1.5"/>
          <circle cx="34" cy="-63" r="3.2" fill="#fff" stroke="#bdbdbd" stroke-width="1.5"/>
        </g>
      </g></g>
    </g>

    <!-- grama da frente -->
    <g class="near" fill="#2f7d34">
      <path d="M40 362 Q44 340 46 330 Q48 342 52 362 Z M52 362 Q58 336 62 324 Q63 340 64 362 Z M64 362 Q70 342 76 334 Q74 346 74 362 Z"/>
      <path d="M272 362 Q276 340 278 330 Q280 342 284 362 Z M284 362 Q290 336 294 324 Q295 340 296 362 Z M296 362 Q302 342 308 334 Q306 346 306 362 Z"/>
      <path d="M504 362 Q508 340 510 330 Q512 342 516 362 Z M516 362 Q522 336 526 324 Q527 340 528 362 Z M528 362 Q534 342 540 334 Q538 346 538 362 Z"/>
      <path d="M736 362 Q740 340 742 330 Q744 342 748 362 Z M748 362 Q754 336 758 324 Q759 340 760 362 Z M760 362 Q766 342 772 334 Q770 346 770 362 Z"/>
      <path d="M968 362 Q972 340 974 330 Q976 342 980 362 Z M980 362 Q986 336 990 324 Q991 340 992 362 Z M992 362 Q998 342 1004 334 Q1002 346 1002 362 Z"/>
      <path d="M1200 362 Q1204 340 1206 330 Q1208 342 1212 362 Z M1212 362 Q1218 336 1222 324 Q1223 340 1224 362 Z M1224 362 Q1230 342 1236 334 Q1234 346 1234 362 Z"/>
    </g>

    <rect width="960" height="360" fill="url(#vig)"/>

    <!-- título -->
    <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
      <rect x="300" y="62" width="360" height="118" rx="18" fill="#04140d" opacity=".74" stroke="#9bcb45" stroke-opacity=".55" stroke-width="2"/>
      <text x="480" y="90" font-size="12" font-weight="700" letter-spacing="4" fill="#a8c4b1" text-anchor="middle">JABDEV ARCADE</text>
      <text x="480" y="132" font-size="40" font-weight="900" letter-spacing="2" fill="#9bcb45" text-anchor="middle">JABOTI <tspan fill="#fff">RUN</tspan></text>
      <text x="480" y="162" font-size="15" font-weight="700" fill="#ffd23a" text-anchor="middle">▶ Clique para jogar</text>
    </g>
  </g>
</svg>
